<!DOCTYPE html>
<html>
    <head>
        <title>LetsGo</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body {
                background-color: #333333;
            }
        </style>
    </head>
    <body>
        <h1>LetsGo</h1>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Est, deleniti.</p>
        <ul>
            <li>Apple</li>
            <li>Banana</li>
            <li>Cherry</li>
        </ul>
        <a href="https://www.google.com">Google</a>
        <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_120x44dp.png" alt="Google Logo">
        <form action="https://www.google.com/search" method="POST">
            <label for="name">Name:</label>
            <input type="text" name="name" placeholder="Enter your name">
            <br>
            <label for="email">Email:</label>
            <input type="email" name="email" placeholder="Enter your email">
            <br>
            <label for="password">Password:</label>
            <input type="password" name="password" placeholder="Enter your password">
            <br>
            <input type="submit" value="Submit">
        </form>
        <button>Click Me</button>
    </body>
</html>
